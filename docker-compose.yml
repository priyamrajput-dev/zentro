services:
  postgresdb:
    image: postgres:15
    restart: unless-stopped
    container_name: postgresdb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zentro

    ports:
      - "5433:5432"

    volumes:
      - zentro_pg_data:/var/lib/postgresql/data

volumes:
  zentro_pg_data:
